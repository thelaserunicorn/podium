# Podium frontend — nginx config that serves the React SPA bundle and
# proxies API traffic to the Go backend container.
#
# Two compose services:
#   - `backend` (Go, port 8080 inside the container)
#   - `frontend` (this nginx, port 80 inside, mapped to 5173 on the host)
#
# The browser hits the frontend on :5173. nginx forwards /api/* and
# /healthz to backend:8080 (docker-compose service name) and serves
# everything else from the React bundle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API + healthz to the backend container. The service name
    # `podium` is the docker-compose service name; port 8080 is what
    # the Go binary listens on (see backend/cmd/podium/main.go).
    location /api/ {
        proxy_pass http://podium:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://podium:8080/healthz;
    }

    # Hashed assets (Vite output: /assets/index-<hash>.js). These must
    # NOT fall back to index.html — that would return HTML where the
    # browser expects JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other path returns index.html so React
    # Router can take over (/dashboard, /apps/42, /login, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
