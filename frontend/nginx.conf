# Podium frontend — nginx config that serves the React SPA bundle and
# proxies API traffic to the Go backend container.
#
# Two compose services:
#   - `podium`   (Go, port 8080 on the HOST because of network_mode: host)
#   - `frontend` (this nginx, port 80 inside, mapped to 5173 on the host)
#
# The `podium` service uses network_mode: host (see docker-compose.yml)
# so the bind-mounted kubeconfig's 127.0.0.1 URLs resolve correctly.
# That means the Go API is reachable on the HOST's loopback, not on the
# compose bridge network — so we can't proxy to "podium:8080" via the
# compose DNS. Instead nginx reaches the host's loopback through the
# container's default gateway. On Docker Desktop / OrbStack / Linux
# Docker, the gateway IP is reachable at the standard host address.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Go API listens on the host's loopback (port 8080) because
    # the `podium` service uses network_mode: host. The frontend
    # container is on the default bridge network, where the gateway
    # IP routes to the host. We use $gateway (set by docker-compose's
    # extra_hosts) so the address is set correctly at runtime.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://host.docker.internal:8080/healthz;
    }

    # Hashed assets (Vite output: /assets/index-<hash>.js). These must
    # NOT fall back to index.html — that would return HTML where the
    # browser expects JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other path returns index.html so React
    # Router can take over (/dashboard, /apps/42, /login, etc.).
    # `no-store` is the strongest possible "don't cache this" signal:
    # the browser MUST revalidate with the server on every visit and
    # MUST NOT persist the response to disk cache. `no-cache` allows
    # disk caching (only forbids reuse without revalidation) which
    # Safari/Chrome can keep around indefinitely in some scenarios —
    # a user reported stale `index.html` referencing an old bundle
    # even after a hard refresh, and the only thing that unblocked
    # them was recreating the frontend container. `no-store` closes
    # that gap: every navigation downloads a fresh index.html that
    # references the current hashed JS bundle in /assets/.
    # The hashed assets themselves are immutable (see the /assets/
    # block above), which is the correct pairing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
