# docker-compose.yml — one-shot Podium demo.
#
# Two services:
#
#   - `podium`  (Go API + orchestrator, image built from ./Dockerfile)
#   - `frontend` (nginx serving the React bundle, image built from
#     ./frontend/Dockerfile, proxies /api/* to podium:8080)
#
# DECISIONS.md A pins the demo path as: Podium on the host, kind cluster
# on the host, Podium talks to the host's docker daemon and the host's
# kubeconfig. This compose file mirrors that path inside two containers
# so `docker compose up` is enough to bring the whole demo up.
#
# The `podium` service uses host networking (see the service block
# comment) so the bind-mounted kubeconfig's
# `server: https://127.0.0.1:<kind-port>` URLs resolve correctly.
# The `frontend` service uses the default bridge network and reaches
# `podium:8080` via the compose DNS resolver — host network mode is
# not needed there because nginx only talks to the API, not the host's
# docker daemon.
#
# Three mounts are required on `podium` (see docs/ubuntu-setup.md for
# the same story from a host-binary perspective):
#
#   - /data → SQLite database + cloned sources (persistent)
#   - ~/.kube/config → kind cluster credentials (read-only)
#   - /var/run/docker.sock → host Docker daemon (so Podium can `docker
#     build` into the host's image cache and `kind load docker-image`
#     into the kind node)
#
# The runtime image is debian:bookworm-slim with git installed (the
# orchestrator shells out to `git clone` for every deploy).

services:
  podium:
    build:
      context: .
      dockerfile: Dockerfile
    image: podium:dev
    container_name: podium
    restart: unless-stopped
    # host network mode: the container shares the host's network
    # namespace, so 127.0.0.1 inside the container is the host's
    # loopback. This is what lets the bind-mounted kubeconfig's
    # `server: https://127.0.0.1:<kind-port>` URLs resolve correctly
    # without rewriting them. Without this, Podium would need a
    # host.docker.internal shim and per-cluster URL rewrites.
    # Trade-off: no Docker network isolation between Podium and the
    # host. Acceptable for a single-host demo; do not expose this
    # compose file to the public internet.
    network_mode: host
    environment:
      PODIUM_ADDR: ":8080"
      PODIUM_ADMIN_USERNAME: ${PODIUM_ADMIN_USERNAME:-admin}
      # Default password is a placeholder; override in production. The
      # README's "Local setup" section calls this out explicitly.
      PODIUM_ADMIN_PASSWORD: ${PODIUM_ADMIN_PASSWORD:-change-me-now}
      PODIUM_DB_PATH: /data/podium.db
      PODIUM_SOURCE_ROOT: /data/sources
      KUBECONFIG: /home/nonroot/.kube/config
    volumes:
      - podium-data:/data
      # Bind-mount the host's kubeconfig. ${HOME} on Linux is /home/<user>;
      # on macOS Docker Desktop / OrbStack the same path resolves.
      - ${HOME}/.kube/config:/home/nonroot/.kube/config:ro
      # Docker socket — without this Podium can't build images or call
      # `kind load docker-image`. On macOS Docker Desktop the default
      # /var/run/docker.sock works without extra_hosts; on Linux it works
      # directly. Reviewers using OrbStack or colima may need to remap.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: podium-frontend:dev
    container_name: podium-frontend
    restart: unless-stopped
    # The frontend talks to the Go backend over the compose network's
    # built-in DNS resolver: nginx.conf references `podium:8080` and
    # docker-compose creates that hostname automatically. We do NOT
    # use network_mode: host here — the frontend only needs to reach
    # the backend, not the host's docker daemon, so the bridge network
    # is fine and gives us clean isolation.
    # No environment block — nginx is a pure static server + reverse
    # proxy; all configuration lives in nginx.conf.
    depends_on:
      - podium
    # Map `host.docker.internal` to the host gateway inside this
    # container. This is what lets nginx reach the Go API listening
    # on the host's loopback (because the `podium` service uses
    # network_mode: host, the API isn't on the compose bridge network).
    # On Docker Desktop / OrbStack this works out of the box; on Linux
    # Docker we need the explicit mapping to the host gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Same port the Vite dev server used (5173) so users on a fresh
      # laptop don't need to learn a new URL.
      - "5173:80"

volumes:
  podium-data:
    # No `driver_opts` — the default local driver is fine for a single-
    # node demo. For production swap in a real volume driver.
